name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, Lint, Tests
        run: npm run check
      - name: Build
        run: npm run build
      - name: Paket erzeugen
        run: cd dist && zip -r ../lese-maze-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: lese-maze-extension
          path: lese-maze-extension.zip
          if-no-files-found: error
